name: Generar y publicar APK de starseeked

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Sin esto, cada ejecución generaba una firma de depuración distinta
      # (Gradle crea ~/.android/debug.keystore con una clave aleatoria nueva
      # si no existe) y Android rechaza instalar un APK firmado con una
      # clave distinta a la ya instalada — por eso el APK "no se actualizaba"
      # aunque la build terminara bien: en realidad la instalación fallaba
      # en silencio y se quedaba la app vieja. Usando siempre el mismo
      # debug.keystore del repositorio, todas las versiones quedan firmadas
      # igual y Android sí puede actualizar la app existente.
      - name: Usar una firma de depuración fija (para poder actualizar la app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Instalar Capacitor
        run: npm install

      - name: Preparar archivos web
        run: |
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest sw.js icon.svg www/

      - name: Crear proyecto Android
        run: npx cap add android

      # La actividad que genera Capacitor (BridgeActivity) no reserva hueco
      # para la barra de estado ni para el "notch"/cámara: no tiene ningún
      # código para eso. Antes no se notaba porque el propio Android lo
      # hacía solo, pero esta app ya apunta a Android 15 (API 35), y desde
      # esa versión el sistema OBLIGA a dibujar la app "de borde a borde" y
      # deja de reservar ese hueco automáticamente — por eso, sin código
      # propio, queda un hueco en blanco arriba (o la cabecera se tapa,
      # según el móvil): la propia página web nunca llega a saber cuánto
      # mide de verdad la barra de estado en ese teléfono.
      # Sustituimos MainActivity.java por una versión que sí mide ese hueco
      # en cada móvil (a través de los WindowInsets nativos de Android) y
      # se lo aplica como margen NATIVO al WebView — no como CSS —, así el
      # hueco de arriba mide siempre justo lo que ocupa la barra de estado
      # real, nunca de más ni de menos, y funciona igual en cualquier
      # versión de Android (con o sin borde a borde forzado).
      - name: Corregir el hueco superior (gestionar los recortes de pantalla)
        run: |
          cat > android/app/src/main/java/com/starseeked/player/MainActivity.java <<'JAVA'
          package com.starseeked.player;

          import android.os.Bundle;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  // Hay que registrar los plugins propios (los que no vienen de
                  // un paquete npm) ANTES de super.onCreate(): es justo ahí
                  // donde Capacitor arranca el puente y carga la lista de
                  // plugins disponibles para la página web.
                  registerPlugin(MediaNotificationPlugin.class);
                  super.onCreate(savedInstanceState);

                  // Dibuja la app de borde a borde en todas las versiones de
                  // Android (a partir de Android 15 el sistema ya lo obliga
                  // igualmente), para que el paso de abajo reciba siempre
                  // los insets reales en vez de que el sistema ya se los
                  // haya "comido" antes de llegar aquí.
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  if (bridge != null && bridge.getWebView() != null) {
                      ViewCompat.setOnApplyWindowInsetsListener(bridge.getWebView(), (view, insets) -> {
                          Insets bars = insets.getInsets(
                              WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout()
                          );
                          // Margen nativo real (no CSS): el WebView empieza a
                          // dibujar justo donde termina la barra de estado /
                          // gestos, ni un pixel antes ni un pixel de más.
                          view.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                          return WindowInsetsCompat.CONSUMED;
                      });
                  }
              }
          }
          JAVA

      # La app ya usa la Media Session del navegador (navigator.mediaSession
      # en app.js: título/artista/portada y botones de reproducir, pausar,
      # anterior y siguiente) pero eso, dentro del WebView de Android que usa
      # la app empaquetada (a diferencia de Chrome como aplicación), NO se
      # convierte por sí solo en una notificación real del sistema — por eso
      # el "widget" de notificación nunca llegaba a aparecer, por más veces
      # que se revisara el CSS o la propia app.js: falta por completo la
      # pieza nativa de Android que sí construye esa notificación.
      # Añadimos esa pieza: un servicio en primer plano (MediaPlaybackService)
      # con una MediaSession real de Android (con controles de verdad,
      # visible también en la pantalla de bloqueo) y un plugin de Capacitor
      # (MediaNotificationPlugin) que conecta ese servicio con app.js en los
      # dos sentidos — la web le manda la canción/estado actual, y la
      # notificación le devuelve a la web las pulsaciones de sus botones.
      - name: Añadir el widget nativo de notificación de reproducción
        run: |
          cat > android/app/src/main/java/com/starseeked/player/MediaPlaybackService.java <<'JAVA'
          package com.starseeked.player;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.support.v4.media.MediaMetadataCompat;
          import android.support.v4.media.session.MediaSessionCompat;
          import android.support.v4.media.session.PlaybackStateCompat;
          import android.util.Base64;
          import android.util.Log;
          import androidx.annotation.Nullable;
          import androidx.core.app.NotificationCompat;
          import androidx.media.app.NotificationCompat.MediaStyle;

          /**
           * Mantiene viva la reproducción y la notificación de "reproduciendo
           * ahora" (con portada y controles) mientras la app está en segundo
           * plano. La propia página web (app.js) es quien manda aquí, a través
           * del plugin MediaNotificationPlugin, qué canción suena y si está en
           * pausa: este servicio no reproduce audio por sí mismo, solo refleja
           * ese estado como una notificación real de Android con controles de
           * verdad.
           */
          public class MediaPlaybackService extends Service {

              public static final String ACTION_UPDATE_METADATA = "com.starseeked.player.action.UPDATE_METADATA";
              public static final String ACTION_UPDATE_STATE = "com.starseeked.player.action.UPDATE_STATE";
              public static final String ACTION_CONTROL = "com.starseeked.player.action.CONTROL";
              public static final String EXTRA_CONTROL = "control";

              private static final String CHANNEL_ID = "starseeked_playback";
              private static final int NOTIFICATION_ID = 4200;

              private MediaSessionCompat mediaSession;
              // Tras mucho tiempo con la pantalla apagada, Android puede entrar en
              // modos de ahorro de batería tan agresivos que llegan a congelar el
              // WebView donde de verdad suena el audio (esta app reproduce el
              // sonido dentro de la propia página web, no aquí). Mientras haya una
              // canción sonando, este "wake lock" parcial le pide al sistema que no
              // deje dormir del todo al procesador — exactamente lo mismo que hace
              // cualquier reproductor de música nativo — y se libera en cuanto se
              // pausa, para no gastar batería de más el resto del tiempo.
              private PowerManager.WakeLock wakeLock;
              private String title = "starseeked";
              private String artist = "";
              private String album = "";
              private Bitmap artwork;
              private boolean isPlaying = false;
              private long positionMs = 0;
              private long durationMs = 0;

              @Override
              public void onCreate() {
                  super.onCreate();
                  PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (powerManager != null) {
                      wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "starseeked:playback");
                      wakeLock.setReferenceCounted(false);
                  }
                  mediaSession = new MediaSessionCompat(this, "starseeked");
                  mediaSession.setCallback(new MediaSessionCompat.Callback() {
                      @Override
                      public void onPlay() {
                          sendControl("play");
                      }

                      @Override
                      public void onPause() {
                          sendControl("pause");
                      }

                      @Override
                      public void onStop() {
                          sendControl("stop");
                      }

                      @Override
                      public void onSkipToNext() {
                          sendControl("next");
                      }

                      @Override
                      public void onSkipToPrevious() {
                          sendControl("previous");
                      }
                  });
                  mediaSession.setActive(true);
                  createNotificationChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) {
                      return START_NOT_STICKY;
                  }
                  String action = intent.getAction();
                  if (ACTION_UPDATE_METADATA.equals(action)) {
                      title = safe(intent.getStringExtra("title"), "starseeked");
                      artist = safe(intent.getStringExtra("artist"), "");
                      album = safe(intent.getStringExtra("album"), "");
                      artwork = decodeArtwork(intent.getStringExtra("artwork"));
                      publishMetadata();
                  } else if (ACTION_UPDATE_STATE.equals(action)) {
                      isPlaying = intent.getBooleanExtra("playing", false);
                      positionMs = Math.round(intent.getDoubleExtra("position", 0.0) * 1000);
                      durationMs = Math.round(intent.getDoubleExtra("duration", 0.0) * 1000);
                      publishState();
                      updateWakeLock();
                  } else if (ACTION_CONTROL.equals(action)) {
                      String control = intent.getStringExtra(EXTRA_CONTROL);
                      sendControl(control);
                      if ("stop".equals(control)) {
                          releaseWakeLock();
                          stopForeground(true);
                          stopSelf();
                          return START_NOT_STICKY;
                      }
                  }
                  Notification notification = buildNotification();
                  startForeground(NOTIFICATION_ID, notification);
                  return START_NOT_STICKY;
              }

              private void publishMetadata() {
                  MediaMetadataCompat.Builder builder = new MediaMetadataCompat.Builder()
                      .putString(MediaMetadataCompat.METADATA_KEY_TITLE, title)
                      .putString(MediaMetadataCompat.METADATA_KEY_ARTIST, artist)
                      .putString(MediaMetadataCompat.METADATA_KEY_ALBUM, album)
                      .putLong(MediaMetadataCompat.METADATA_KEY_DURATION, durationMs);
                  if (artwork != null) {
                      builder.putBitmap(MediaMetadataCompat.METADATA_KEY_ALBUM_ART, artwork);
                  }
                  mediaSession.setMetadata(builder.build());
              }

              private void publishState() {
                  long actions = PlaybackStateCompat.ACTION_PLAY
                      | PlaybackStateCompat.ACTION_PAUSE
                      | PlaybackStateCompat.ACTION_PLAY_PAUSE
                      | PlaybackStateCompat.ACTION_SKIP_TO_NEXT
                      | PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS
                      | PlaybackStateCompat.ACTION_STOP;
                  int state = isPlaying ? PlaybackStateCompat.STATE_PLAYING : PlaybackStateCompat.STATE_PAUSED;
                  PlaybackStateCompat playbackState = new PlaybackStateCompat.Builder()
                      .setActions(actions)
                      .setState(state, positionMs, isPlaying ? 1f : 0f)
                      .build();
                  mediaSession.setPlaybackState(playbackState);
              }

              private Notification buildNotification() {
                  PendingIntent playPauseIntent = controlPendingIntent(isPlaying ? "pause" : "play", 1);
                  PendingIntent nextIntent = controlPendingIntent("next", 2);
                  PendingIntent previousIntent = controlPendingIntent("previous", 3);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(title)
                      .setContentText(artist)
                      .setSubText(album)
                      .setOngoing(isPlaying)
                      .setOnlyAlertOnce(true)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .addAction(android.R.drawable.ic_media_previous, "Anterior", previousIntent)
                      .addAction(
                          isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                          isPlaying ? "Pausar" : "Reproducir",
                          playPauseIntent
                      )
                      .addAction(android.R.drawable.ic_media_next, "Siguiente", nextIntent)
                      .setStyle(
                          new MediaStyle().setMediaSession(mediaSession.getSessionToken()).setShowActionsInCompactView(0, 1, 2)
                      );
                  if (artwork != null) {
                      builder.setLargeIcon(artwork);
                  }
                  return builder.build();
              }

              private PendingIntent controlPendingIntent(String control, int requestCode) {
                  Intent intent = new Intent(this, MediaPlaybackService.class);
                  intent.setAction(ACTION_CONTROL);
                  intent.putExtra(EXTRA_CONTROL, control);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                  return PendingIntent.getService(this, requestCode, intent, flags);
              }

              private void sendControl(String control) {
                  MediaNotificationPlugin.notifyControlAction(control);
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null && manager.getNotificationChannel(CHANNEL_ID) == null) {
                          NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Reproducción de música",
                              NotificationManager.IMPORTANCE_LOW
                          );
                          channel.setDescription("Controles de reproducción de starseeked");
                          channel.setShowBadge(false);
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              private Bitmap decodeArtwork(String dataUrl) {
                  if (dataUrl == null || dataUrl.isEmpty()) {
                      return null;
                  }
                  try {
                      String base64 = dataUrl.contains(",") ? dataUrl.substring(dataUrl.indexOf(',') + 1) : dataUrl;
                      byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                      return BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                  } catch (Exception e) {
                      Log.w("MediaPlaybackService", "No se pudo decodificar la portada", e);
                      return null;
                  }
              }

              private String safe(String value, String fallback) {
                  return value == null ? fallback : value;
              }

              private void updateWakeLock() {
                  if (wakeLock == null) return;
                  if (isPlaying) {
                      if (!wakeLock.isHeld()) wakeLock.acquire();
                  } else {
                      releaseWakeLock();
                  }
              }

              private void releaseWakeLock() {
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              }

              @Nullable
              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  releaseWakeLock();
                  if (mediaSession != null) {
                      mediaSession.setActive(false);
                      mediaSession.release();
                  }
                  super.onDestroy();
              }
          }
          JAVA

          cat > android/app/src/main/java/com/starseeked/player/MediaNotificationPlugin.java <<'JAVA'
          package com.starseeked.player;

          import android.Manifest;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.content.ContextCompat;
          import android.util.Log;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          /**
           * Puente entre la página web (app.js) y la notificación nativa de
           * reproducción. La web ya sabe qué canción suena y si está en pausa
           * (usa navigator.mediaSession internamente); este plugin solo
           * traslada esos datos a MediaPlaybackService, y devuelve a la web
           * las pulsaciones de los botones de la notificación como evento
           * "controlAction".
           */
          @CapacitorPlugin(
              name = "MediaNotification",
              permissions = { @Permission(strings = { Manifest.permission.POST_NOTIFICATIONS }, alias = "notifications") }
          )
          public class MediaNotificationPlugin extends Plugin {

              private static MediaNotificationPlugin activeInstance;

              @Override
              public void load() {
                  super.load();
                  activeInstance = this;
              }

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  if (Build.VERSION.SDK_INT < 33 || getPermissionState("notifications") == PermissionState.GRANTED) {
                      resolveWithGranted(call, true);
                      return;
                  }
                  requestPermissionForAlias("notifications", call, "notificationPermsCallback");
              }

              @PermissionCallback
              private void notificationPermsCallback(PluginCall call) {
                  // Antes esto resolvía siempre como si todo hubiera ido bien,
                  // aunque la persona hubiera denegado el permiso — así que
                  // app.js nunca podía saber que el widget no iba a poder
                  // aparecer. Ahora sí se informa el resultado real.
                  resolveWithGranted(call, getPermissionState("notifications") == PermissionState.GRANTED);
              }

              private void resolveWithGranted(PluginCall call, boolean granted) {
                  JSObject result = new JSObject();
                  result.put("granted", granted);
                  call.resolve(result);
              }

              @PluginMethod
              public void updateMetadata(PluginCall call) {
                  Intent intent = new Intent(getContext(), MediaPlaybackService.class);
                  intent.setAction(MediaPlaybackService.ACTION_UPDATE_METADATA);
                  intent.putExtra("title", call.getString("title", "starseeked"));
                  intent.putExtra("artist", call.getString("artist", ""));
                  intent.putExtra("album", call.getString("album", ""));
                  intent.putExtra("artwork", call.getString("artwork", ""));
                  startPlaybackService(intent);
                  call.resolve();
              }

              @PluginMethod
              public void updatePlaybackState(PluginCall call) {
                  Intent intent = new Intent(getContext(), MediaPlaybackService.class);
                  intent.setAction(MediaPlaybackService.ACTION_UPDATE_STATE);
                  intent.putExtra("playing", Boolean.TRUE.equals(call.getBoolean("playing", false)));
                  intent.putExtra("position", call.getDouble("position", 0.0));
                  intent.putExtra("duration", call.getDouble("duration", 0.0));
                  startPlaybackService(intent);
                  call.resolve();
              }

              private void startPlaybackService(Intent intent) {
                  try {
                      ContextCompat.startForegroundService(getContext(), intent);
                  } catch (Exception e) {
                      Log.w("MediaNotification", "No se pudo actualizar la notificación de reproducción", e);
                  }
              }

              static void notifyControlAction(String action) {
                  if (activeInstance == null || action == null) {
                      return;
                  }
                  JSObject data = new JSObject();
                  data.put("action", action);
                  activeInstance.notifyListeners("controlAction", data);
              }
          }
          JAVA

          python3 - <<'PY'
          import re

          # 1) Gradle: el servicio necesita MediaSessionCompat / PlaybackStateCompat /
          #    MediaMetadataCompat y el MediaStyle de notificaciones, que viven en
          #    androidx.media (no en androidx.core, que ya estaba incluido).
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, encoding='utf-8') as f:
              gradle = f.read()
          anchor = '    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"\n'
          if anchor not in gradle:
              raise SystemExit('No se encontró la línea de core-splashscreen en build.gradle para añadir androidx.media')
          if 'androidx.media:media' not in gradle:
              gradle = gradle.replace(anchor, anchor + '    implementation "androidx.media:media:1.7.0"\n')
              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(gradle)
              print('androidx.media añadido a build.gradle')
          else:
              print('androidx.media ya estaba en build.gradle')

          # 2) Manifest: permisos para el servicio en primer plano + notificaciones,
          #    y declaración del propio servicio con su tipo (obligatorio en Android 14+).
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, encoding='utf-8') as f:
              manifest = f.read()

          perm_anchor = '    <uses-permission android:name="android.permission.INTERNET" />'
          extra_perms = (
              perm_anchor + '\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />'
          )
          if perm_anchor not in manifest:
              raise SystemExit('No se encontró el permiso de INTERNET en AndroidManifest.xml')
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in manifest:
              manifest = manifest.replace(perm_anchor, extra_perms)
          elif 'permission.WAKE_LOCK' not in manifest:
              # Por si alguna vez se ejecuta este script sobre un manifest que ya
              # tenía los permisos anteriores pero no este (defensivo; en la
              # práctica el proyecto Android se regenera entero en cada build).
              manifest = manifest.replace(
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              )

          service_block = (
              '        <service\n'
              '            android:name=".MediaPlaybackService"\n'
              '            android:exported="false"\n'
              '            android:foregroundServiceType="mediaPlayback" />\n'
              '    </application>'
          )
          if 'MediaPlaybackService' not in manifest.split('</application>')[0] or '.MediaPlaybackService"' not in manifest:
              manifest = manifest.replace('    </application>', service_block)

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(manifest)
          print('AndroidManifest.xml actualizado')
          PY

      - name: Generar el icono de la app (fondo + estrellas en assets/)
        run: npx @capacitor/assets generate --android

      # @capacitor/assets (v3.0.5) tiene un fallo conocido: al generar el
      # icono adaptativo escribe un "recorte" (inset) del 16.7% tanto en la
      # capa de primer plano (correcto, para que las estrellas no se corten
      # con las máscaras redondas/cuadradas de cada móvil) como en la capa
      # de FONDO (incorrecto: eso deja el fondo flotando como una "burbuja"
      # pequeña rodeada de espacio vacío, en vez de cubrir todo el icono).
      # Aquí quitamos ese recorte solo del fondo para que rellene el icono
      # de borde a borde, tal y como se ve en la vista previa.
      - name: Corregir el fondo del icono adaptativo (quitar la "burbuja")
        run: |
          python3 - <<'PY'
          import re, glob
          pattern = re.compile(
              r'<background>\s*<inset[^>]*android:drawable="@mipmap/ic_launcher_background"[^>]*/>\s*</background>'
          )
          replacement = '<background android:drawable="@mipmap/ic_launcher_background" />'
          changed = 0
          for path in glob.glob('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml'):
              with open(path, encoding='utf-8') as f:
                  xml = f.read()
              fixed = pattern.sub(replacement, xml)
              if fixed != xml:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(fixed)
                  changed += 1
                  print('Corregido:', path)
              else:
                  print('Sin cambios necesarios:', path)
          if changed == 0:
              raise SystemExit('No se corrigió ningún icon.xml: revisa el formato generado por @capacitor/assets')
          PY

      - name: Copiar la aplicación web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK de Android
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: starseeked-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publicar APK descargable en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk starseeked.apk
          gh release create "$TAG" starseeked.apk --target "${{ github.sha }}" --title "starseeked Android $TAG" --notes "APK generado automáticamente desde la rama main. Descarga e instala starseeked en Android."
